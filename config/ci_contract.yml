# ci_contract.yml — what "green" means in this repository, as data.
#
# The definition of green was spread across two workflow files and one script.
# tests.yaml ran three gates in a specific order for reasons recorded only in a
# comment; run_suite_gate.R hard-coded the manifest path and the three rules it
# enforces; R-CMD-check.yaml duplicated the third gate and had already drifted
# once, when it used stop_on_failure = TRUE and disagreed with tests.yaml about
# whether the preserved failures were fatal.
#
# Putting the contract in one file does not by itself stop drift, so it is
# read at runtime by tests/run_suite_gate.R and checked by
# tests/testthat/test-ci_contract.R. A gate listed here that does not exist, or
# a workflow that stops calling the gate, fails the suite.
#
# It is a contract about PROCESS, not about science. Nothing here encodes a
# scientific threshold; the estimand and its thresholds live in config.yml and
# in the tests themselves.

version: 1

# Ordered. Each gate runs only if the previous one passed, so the cheapest and
# most diagnostic failures surface first.
gates:
  - id: bva
    name: Decision precedence and denominator contracts (BVA)
    file: tests/testthat/test-decision_precedence_bva.R
    policy: all_must_pass
    rationale: >
      These encode defects that actually reached the analysis outputs. They run
      first so a failure stops the job before the slower suite runs.

  - id: mutation
    name: Mutation tests (every planted defect must be killed)
    file: tests/testthat/test-decision_mutation.R
    policy: all_must_pass
    rationale: >
      A surviving mutant means the suite has stopped detecting a defect it was
      written to catch, which a passing test run alone cannot show.

  - id: deidentification
    name: Study-staff identities stay out of committed data
    file: tests/testthat/test-deidentification_guard.R
    policy: all_must_pass
    rationale: >
      output/manual_review_decisions.csv is committed and was carrying the real
      initials of the three people who did the adjudication. They are now
      pseudonymised to R01/R02/R03. This gate runs before the full suite because
      a regression here republishes identities, which no later green run undoes.

  - id: operator_identity
    name: Operator identity and machine paths stay out of the repository
    file: tests/testthat/test-operator_identity.R
    policy: all_must_pass
    rationale: >
      Absolute paths under a named home directory, and the operator's own name
      in committed config, identify a person and break reproduction on any other
      machine. Guarded together with the reviewer pseudonyms because both are
      identity leaking through generated artefacts.

  - id: suite
    name: Full test suite
    runner: tests/run_suite_gate.R
    policy: manifest
    rationale: >
      The suite preserves failing tests on purpose, each marking an open
      decision that belongs to the author. Failing on all of them meant CI had
      never been green and so could not signal anything.

# How the manifest gate decides. run_suite_gate.R reads these rather than
# hard-coding them.
manifest:
  path: tests/expected_failures.yaml

  # A failure that is not on the manifest is a regression.
  fail_on_unexpected_failure: true

  # An entry that now passes means the decision was taken and the entry has
  # outlived its reason.
  fail_on_stale_entry: true

  # An entry naming a test that never ran was renamed or deleted, and would
  # otherwise sit there describing a decision with no assertion behind it.
  fail_on_orphaned_entry: true

  # Every entry must say why it fails and what decision it waits on, so the
  # manifest cannot become a list of bare test names.
  require_fields: [file, test, reason, decision_needed]

  # Not a quality bar, a ratchet: the manifest is meant to shrink. Raising this
  # should be a deliberate act with a reason in the commit message.
  #
  # Raised from 20 to 24 during cycles 17-24 of the test-generation loop. The
  # reason is not that the tests became noisy: every entry added in those cycles
  # names a specific artefact, a specific count, and a decision that belongs to
  # the author. The loop is surfacing decisions faster than they are being
  # answered, and refusing to register a real finding to stay under a ceiling
  # would be the ceiling defeating its own purpose.
  #
  # This should come back DOWN as decisions are closed. It is not a new normal.
  max_entries: 24

# The approved-skip manifest. A skipped test asserts nothing, so an unapproved
# skip is coverage that disappeared without anyone saying so. Enforced in one
# direction only: see the header of tests/expected_skips.yaml for why an
# approved skip that runs anyway is reported rather than failed.
skips:
  path: tests/expected_skips.yaml

  # A test that skips with no entry is a regression in coverage.
  fail_on_unapproved_skip: true

  # Every entry must say why it cannot run and what would make it run, so the
  # list stays a backlog rather than becoming a set of permanent exemptions.
  require_fields: [file, test, reason, to_enable]

# Workflows that must exist and must invoke the suite gate. Adding a workflow
# that runs tests its own way is how the two files drifted the first time.
# Every workflow in .github/workflows/ must appear here. A workflow that runs
# without being declared is exactly how tests.yaml and R-CMD-check.yaml drifted
# apart about what green meant, and test-ci_contract.R now fails on an
# undeclared one rather than only on a declared-but-missing one.
workflows:
  - path: .github/workflows/tests.yaml
    must_invoke_gate: true
    role: Runs the ordered gates above and decides whether the suite is green.

  - path: .github/workflows/R-CMD-check.yaml
    must_invoke_gate: true
    role: >
      Runs the same gate under R CMD check conditions, so the two cannot
      disagree about green the way they did once before.

  # Renders rather than gates: it knits docs/*.Rmd against the committed
  # outputs and fails if any document errors. It deliberately does not call the
  # suite gate, so must_invoke_gate is false and that is a declared property
  # rather than an omission.
  - path: .github/workflows/manuscript.yaml
    must_invoke_gate: false
    role: >
      Renders every document under docs/ from a clean checkout. Their chunks
      read output/ and data/processed/ at knit time, so a renamed column breaks
      the manuscript while the whole suite stays green.
