    external_sources: []
    grain_in: one abstract
    grain_out: one abstract with publication metadata
    primary_key: abstract_id
    cache: null
    manual_step: false
    reproducible: true
    tests: [tests/testthat/test-pipeline_semantics.R]
    notes: >
      Creates output/abstracts_with_matches.csv from scratch with 45 columns;
      re-running it alone destroys every enrichment column (F10). 283 of 1102
      best_pmid values do not resolve against the stale candidate file (F2).

  - id: adjudication
    name: Human adjudication (Shiny + Google Sheets)
    script: shiny/adjudication_app/app.R
    in_run_all: deploy only
    functions: [gs_read_decisions, gs_append_decision, gs_dedup_sheet, dedup_decisions]
    inputs:
      - output/manual_review_queue.csv
      - output/abstracts_with_matches.csv
      - data/processed/abstracts_cleaned.csv
      - data/processed/match_scores_detailed.rds
      - data/processed/pubmed_candidates.csv
    outputs:
      - output/manual_review_decisions.csv
    external_sources:
      - Google Sheet 1d2YAsndMxCPK0AQMHw4bgKp3glFg_znGj8Riq5YpfaI, worksheet "decisions"
    grain_in: one abstract in the review queue
    grain_out: one decision by one reviewer at one time
    primary_key: [abstract_id, reviewer, review_timestamp]
    cache: shiny/adjudication_app/bundle/ (135 days stale)
    manual_step: true
    reproducible: false
    tests:
      - tests/testthat/test-shiny_app.R
      - tests/testthat/test-shiny_e2e.R
    notes: >
      Decision vocabulary is exactly match / no_match / skip. Review is not
      blinded to the algorithm. The Google Sheet is the live store; the CSV is
      a manual export.

