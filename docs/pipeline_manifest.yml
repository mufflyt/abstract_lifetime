# pipeline_manifest.yml — machine-readable description of the pipeline as it
# actually exists in this repository. Prose form: docs/PIPELINE.md.
#
# Verified against the working tree on 2026-09-03 at commit 665c551.
# tests/testthat/test-docs_drift.R asserts that every `script` and every
# `inputs`/`outputs` path marked authoritative resolves on disk.
#
# `in_run_all` records whether 00_run_all.R sources the script. Ten pipeline
# scripts are not reachable from it; see PIPELINE.md.

meta:
  repository: abstract_lifetime
  commit: 665c551b74f4c6b2796de03b23596f27e6f7ac9d
  branch: fix/denominator-excluded-abstracts
  verified: 2026-09-03
  cohort_n: 1106
  denominator_n: 1051
  published_n: 178
  unresolved_n: 55
  publication_rate: 0.1694

stages:

  - id: "01b"
    name: Parse JMIG AAGL supplements from ScienceDirect
    script: R/01b_parse_web.R
    in_run_all: true
    functions: [scrape_listing_page, parse_sd_item, sd_pii_from_url,
                fetch_sd_html_cached, fetch_article_abstract]
    inputs:
      - "config.yml#congresses[*].sciencedirect_url"
    outputs:
      - data/processed/abstracts_parsed_web.csv
      - data/processed/abstracts_parsed.csv
    external_sources: [ScienceDirect issue listing, ScienceDirect article pages]
    grain_in: one ScienceDirect listing item
    grain_out: one congress presentation
    primary_key: abstract_id
    cache: data/cache/sd_html/ (1154 files, gitignored, currently unrefetchable - HTTP 403)
    manual_step: false
    reproducible: false
    tests: []
    notes: >
      Short-circuits when the parsed CSV already covers every configured
      congress with >= 80 rows each, so the scrape has not run since
      2026-04-19. Captures only the first ~100 listing items per congress
      against 392-852 supplement items in Crossref. See FAILURE_MODES.md F1.

  - id: "01_pdf"
    name: PDF fallback parser
    script: R/01_parse_pdf.R
    in_run_all: conditional
    functions: []
    inputs: [data/raw/ (does not exist)]
    outputs: [data/processed/abstracts_parsed_pdf.csv]
    external_sources: [AAGL supplement PDF]
    grain_in: one PDF page
    grain_out: one congress presentation
    primary_key: abstract_id
    cache: null
    manual_step: true
    reproducible: false
    tests: []
    notes: Sourced only when abstracts_parsed.csv is absent. Has never run.

  - id: "01c"
    name: Compare web and PDF sources
    script: R/01c_compare_sources.R
    in_run_all: conditional
    functions: []
    inputs: [data/processed/abstracts_parsed_web.csv, data/processed/abstracts_parsed_pdf.csv]
    outputs: []
    external_sources: []
    grain_in: one congress presentation
    grain_out: comparison report
    primary_key: abstract_id
    cache: null
    manual_step: false
    reproducible: true
    tests: []
    notes: Gated on a PDF file that has never existed; never fires.

  - id: "01d"
    name: Tag programme section (Oral / Video / Poster)
    script: R/01d_tag_session_type.R
    in_run_all: true
    functions: [tag_one_congress, pii_from_url, merge_session]
    inputs:
      - "config.yml#congresses[*].sciencedirect_url"
      - data/processed/abstracts_parsed_web.csv
    outputs:
      - data/processed/abstracts_parsed_web.csv
      - data/processed/abstracts_parsed.csv
      - data/processed/abstracts_cleaned.csv
      - output/abstracts_with_matches.csv
    external_sources: [ScienceDirect supplement table of contents]
    grain_in: one TOC node
    grain_out: one congress presentation
    primary_key: abstract_id
    cache: null
    manual_step: false
    reproducible: false
    tests: [tests/testthat/test-pipeline_semantics.R]
    notes: >
      Writes session_type in place into four files. Walks h3.section-title and
      li.js-article-list-item in DOM order.

  - id: "02"
    name: Clean abstracts, define the cohort, derive predictors
    script: R/02_clean_abstracts.R
    in_run_all: true
    functions: [normalize_title, normalize_author, normalize_authors,
                extract_keywords, classify_result_positivity]
    inputs: [data/processed/abstracts_parsed.csv]
    outputs: [data/processed/abstracts_cleaned.csv]
    external_sources: []
    grain_in: one congress presentation (1154)
    grain_out: one eligible oral presentation (1106)
    primary_key: abstract_id
    cache: null
    manual_step: false
    reproducible: true
    tests:
      - tests/testthat/test-pipeline_semantics.R
      - tests/testthat/test-utils_text.R
      - tests/testthat/test-utils_classify.R
      - tests/testthat/test-utils_positivity.R
    notes: >
      Applies the only cohort exclusion (48 videos). Derives ~20 predictors by
      regex over search_text, which is title-only for 2012-2018 because the
      text backfill runs afterwards. See FAILURE_MODES.md F3.

  - id: "02b"
    name: Backfill abstract text from PubMed XML
    script: R/02b_backfill_abstract_text.R
    in_run_all: true
    functions: [fetch_pubmed_by_doi, parse_abstract_from_xml]
    inputs: [data/processed/abstracts_cleaned.csv]
    outputs: [data/processed/abstracts_cleaned.csv]
    external_sources: [NCBI E-utilities]
    grain_in: one abstract with a DOI and no text
    grain_out: one abstract with abstract_text patched
    primary_key: abstract_id
    cache: data/cache/pubmed_xml/
    manual_step: false
    reproducible: true
    tests: [tests/testthat/test-shiny_app.R]
    notes: Patches abstract_text only. Section columns and predictors are untouched.

  - id: "02c"
    name: Backfill abstract text from cached ScienceDirect snippets
    script: scripts/backfill_sciencedirect_snippets.R
    in_run_all: true
