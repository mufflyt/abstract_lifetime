    inputs: [data/processed/abstracts_cleaned.csv, data/cache/sd_html/]
    outputs: [data/processed/abstracts_cleaned.csv]
    external_sources: ["ScienceDirect #preview-section-snippets"]
    grain_in: one abstract with no text
    grain_out: one abstract with abstract_text patched
    primary_key: abstract_id
    cache: data/cache/sd_html/
    manual_step: false
    reproducible: false
    tests: [tests/testthat/test-shiny_app.R]
    notes: Same limitation as 02b.

  - id: "03"
    name: Six-strategy PubMed search
    script: R/03_search_pubmed.R
    in_run_all: true
    functions: [build_search_strategies, build_date_filter, rate_limited_search,
                search_abstract, fetch_pubmed_details, parse_pubmed_xml,
                is_supplement_article]
    inputs: [data/processed/abstracts_cleaned.csv]
    outputs:
      - data/processed/pubmed_candidates.csv
      - data/processed/pubmed_strategy_results.csv
      - output/search_strategy_efficacy.csv
    external_sources: [NCBI E-utilities]
    grain_in: one abstract
    grain_out: one (abstract_id x pmid) candidate pair
    primary_key: [abstract_id, pmid]
    cache: data/cache/checkpoints/pubmed_search_checkpoint.rds
    manual_step: false
    reproducible: true
    tests: []
    notes: >
      A failed API call is indistinguishable from a zero result
      (FAILURE_MODES.md F5). The checkpoint resumes but never invalidates (F6).

  - id: "03b"
    name: Supplementary search - CrossRef, Europe PMC, OpenAlex, Semantic Scholar
    script: R/03b_search_crossref.R
    in_run_all: true
    functions: [search_crossref, search_europmc, search_openalex,
                search_semantic_scholar, fetch_pubmed_details]
    inputs:
      - data/processed/abstracts_cleaned.csv
      - data/processed/pubmed_candidates.csv
      - data/processed/doi_chain_candidates.csv
    outputs:
      - data/processed/crossref_candidates.csv
      - data/processed/europmc_candidates.csv
      - data/processed/openalex_candidates.csv
      - data/processed/semantic_scholar_candidates.csv
      - data/processed/pubmed_candidates.csv
    external_sources: [CrossRef REST, Europe PMC REST, OpenAlex, Semantic Scholar Graph]
    grain_in: one abstract
    grain_out: one (abstract_id x pmid) candidate pair
    primary_key: [abstract_id, pmid]
    cache:
      - data/cache/checkpoints/europmc_search_checkpoint.rds
      - data/cache/checkpoints/openalex_search_checkpoint.rds
      - data/cache/checkpoints/semantic_scholar_checkpoint.rds
    manual_step: false
    reproducible: true
    tests: [tests/testthat/test-utils_crossref.R]
    notes: >
      Rewrites pubmed_candidates.csv in place - the mechanism behind
      FAILURE_MODES.md F2. Its inline JMIG supplement filter and
      search_europmc() still use the pre-April-2026 over-broad rule.

