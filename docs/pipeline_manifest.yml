    outputs:
      - data/processed/match_scores.csv
      - data/processed/match_scores_detailed.rds
    external_sources: []
    grain_in: one (abstract x candidate) pair
    grain_out: one abstract with its best candidate
    primary_key: abstract_id
    cache: null
    manual_step: false
    reproducible: true
    tests:
      - tests/testthat/test-utils_scoring.R
      - tests/testthat/test-cycle01_thresholds_contracts.R
      - tests/testthat/test-pipeline_semantics.R
    notes: >
      64718 pairs scored. keyword_pts is 0 for every abstract, so the
      "10-component" score is functionally nine-component.

  - id: "05"
