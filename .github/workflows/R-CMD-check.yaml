on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::withr
            any::here
            any::config
            any::stringdist
            any::digest
            any::purrr
            any::dplyr
            any::readr
            any::stringr
            any::stringi
            any::cli
            mufflyt/mysterycall@42d66d92ef52a0f85d1f7c61208c2ddd79d9c06e

      # Same gate as tests.yaml: green when the only failures are the ones
      # listed in tests/expected_failures.yaml, red on anything else and red if
      # one of those starts passing.
      - name: Run tests
        run: Rscript tests/run_suite_gate.R

      - name: Lint R files
        run: |
          if (requireNamespace("lintr", quietly = TRUE)) {
            lintr::lint_dir("R/")
          } else {
            message("lintr not installed, skipping")
          }
        shell: Rscript {0}
        continue-on-error: true
