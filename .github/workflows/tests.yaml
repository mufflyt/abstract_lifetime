# Test suite: every push and PR on any branch, plus nightly.
#
# The nightly run exists because this repository's analytical outputs are
# committed. tests/testthat/test-decision_precedence_bva.R asserts invariants
# against those committed files, so a nightly run catches an output tree that
# has drifted out of agreement with the code that produced it, which is the
# failure mode that produced the 1,067 / 1,012 / 1,051 confusion.
#
# NOTE: GitHub only fires `schedule` on the repository's DEFAULT branch. The
# nightly will not run until this workflow is merged to master.

name: tests

on:
  push:
  pull_request:
  schedule:
    # 08:00 UTC = 02:00 America/Denver (MDT). Adjust to 09:00 UTC for MST.
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testthat:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # mysterycall is a GitHub-only package. Without an explicit source pak
      # resolves it from CRAN, finds nothing, and the dependency step fails
      # before a single test runs. Pinned to the same commit as
      # docs/REPRODUCIBILITY.md. Every use of it degrades gracefully, so the
      # suite still passes if this install is ever dropped.
      #
      # Comments must NOT appear inside the block literal below: pak reads every
      # line of it as a package reference and fails with "Cannot parse package".
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::here
            any::config
            any::dplyr
            any::tibble
            any::tidyr
            any::readr
            any::purrr
            any::stringr
            any::stringi
            any::stringdist
            any::digest
            any::cli
            any::yaml
            any::irr
            mufflyt/mysterycall@42d66d92ef52a0f85d1f7c61208c2ddd79d9c06e

      # Gate 1. The decision-logic contracts. These encode defects that reached
      # the analysis outputs, so they run first and a failure here stops the job
      # before the slower suite runs.
      - name: Decision precedence and denominator contracts (BVA)
        run: |
          library(testthat)
          res <- test_file("tests/testthat/test-decision_precedence_bva.R",
                           reporter = "summary", stop_on_failure = FALSE)
          df <- as.data.frame(res)
          n_fail <- sum(df$failed) + sum(df$error)
          cat("BVA assertions passed:", sum(df$passed), " failed:", n_fail, "\n")
          if (n_fail > 0) stop("BVA contract failures: ", n_fail)
        shell: Rscript {0}

      # Gate 2. Mutation testing. A surviving mutant means the suite above has
      # stopped detecting a defect it was written to catch, which is not visible
      # from a passing test run alone.
      - name: Mutation tests (every planted defect must be killed)
        run: |
          library(testthat)
          res <- test_file("tests/testthat/test-decision_mutation.R",
                           reporter = "summary", stop_on_failure = FALSE)
          df <- as.data.frame(res)
          n_fail <- sum(df$failed) + sum(df$error)
          cat("mutation assertions passed:", sum(df$passed), " failed:", n_fail, "\n")
          if (n_fail > 0) {
            stop("A planted defect survived. The test suite no longer detects a ",
                 "regression it was written to catch. Do not weaken the mutant; ",
                 "strengthen the invariant battery in test-decision_mutation.R.")
          }
        shell: Rscript {0}

      # Gate 3. Everything else, measured against tests/expected_failures.yaml.
      #
      # This repository preserves failing tests on purpose - each marks an open
      # decision that belongs to the author. Failing the build on all of them
      # meant CI had never been green and could not signal anything. This gate
      # fails when a test fails that is NOT on the manifest, and equally when a
      # test ON the manifest passes, so the manifest cannot quietly rot.
      - name: Full test suite
        run: |
          library(testthat)
          res <- test_dir("tests/testthat", reporter = "summary",
                          stop_on_failure = FALSE)
          df <- as.data.frame(res)

          cat("\n--- suite summary ---\n")
          cat("files:", length(unique(df$file)), " passed:", sum(df$passed),
              " failed:", sum(df$failed), " errors:", sum(df$error),
              " skipped:", sum(df$skipped), "\n")

          manifest <- yaml::read_yaml("tests/expected_failures.yaml")$expected_failures
          expected <- data.frame(
            file = vapply(manifest, `[[`, character(1), "file"),
            test = vapply(manifest, `[[`, character(1), "test"),
            stringsAsFactors = FALSE
          )
          key <- function(f, t) paste(f, t, sep = " :: ")
          expected_keys <- key(expected$file, expected$test)

          failed <- df[df$failed > 0 | df$error > 0, ]
          failed_keys <- key(failed$file, failed$test)

          unexpected <- failed[!failed_keys %in% expected_keys, , drop = FALSE]
          passing_df <- df[df$failed == 0 & df$error == 0, ]
          stale <- expected_keys[expected_keys %in% key(passing_df$file, passing_df$test)]

          if (nrow(failed) > 0) {
            cat("\n--- failures ---\n")
            for (i in seq_len(nrow(failed))) {
              tag <- if (failed_keys[i] %in% expected_keys) "EXPECTED" else "UNEXPECTED"
              cat(sprintf("  [%s] %s :: %s\n", tag, failed$file[i], failed$test[i]))
            }
          }

          problems <- character()
          if (nrow(unexpected) > 0) {
            problems <- c(problems, sprintf(
              "%d unexpected failure(s). Fix them, or add them to tests/expected_failures.yaml with a reason and the decision they are waiting on.",
              nrow(unexpected)))
          }
          if (length(stale) > 0) {
            cat("\n--- stale manifest entries (these now PASS) ---\n")
            cat(paste0("  ", stale, collapse = "\n"), "\n")
            problems <- c(problems, sprintf(
              "%d expected-failure entr(y/ies) now pass. Remove them from tests/expected_failures.yaml.",
              length(stale)))
          }
          if (length(problems) > 0) stop(paste(problems, collapse = " | "))

          cat("\nSuite green:", nrow(failed), "failure(s), all on the expected-failure manifest.\n")
        shell: Rscript {0}

      - name: Lint
        run: |
          if (requireNamespace("lintr", quietly = TRUE)) lintr::lint_dir("R/")
        shell: Rscript {0}
        continue-on-error: true
