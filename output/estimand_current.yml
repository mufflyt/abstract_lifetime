population:
  congress_years:
  - 2012
  - 2013
  - 2014
  - 2015
  - 2016
  - 2017
  - 2018
  - 2019
  - 2020
  - 2021
  - 2022
  - 2023
  n_congress_years: 12
  cohort_size: 1106
  unit_of_analysis: one conference abstract
denominator:
  rule: abstracts whose match status was resolved
  excludes_unresolved: yes
  n_unresolved: 55
  n_evaluated: 1051
outcome:
  definition: matched to a full publication that appeared after the congress
  counted_as_published: classification == 'definite', or a reviewer decision of match;
    in either case only if the credited publication's print issue date is on or after
    the congress date, and never against a human no_match (PI decisions, 2026-09-05)
  human_no_match_overrides: yes; an AUTO no_match does not
  pre_congress_excluded: always; no classification or reviewer verdict overrides it
  n_events: 170
time:
  origin: congress date
  censoring: administrative at the end of the search window
  search_window_start: 2012/11/01
  search_window_end: 2026/04/01
  interval_units: months
estimation:
  survival_model: Kaplan-Meier and Cox proportional hazards
  pre_congress_handling: publications dated before their congress are excluded from
    the interval
